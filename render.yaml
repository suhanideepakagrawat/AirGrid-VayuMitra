# One-click deploy of the whole AirGrid / VayuMitra stack to Render.
#
#   Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
#
# It creates BOTH services and wires them together automatically:
#   1. vayumitra-advisory — FastAPI. Serves the team API (/api/v1/*), the
#      advisory API (/advisory /chat /compare /sources /tts /wards /locate
#      /deployment /enforcement/top /metrics /meta) and the VayuMitra citizen
#      chat UI at "/" and "/citizen".
#   2. airgrid-dashboard  — the TanStack Start operator dashboard. Its
#      VITE_API_URL is filled in from service 1 by Render, so there is nothing
#      to paste by hand.
#
# Only the secret keys need typing (marked `sync: false`). Every one of them is
# OPTIONAL: with no keys the advisory still answers using deterministic CPCB
# templates + the Hindi phrase table, and voice falls back to the browser.
#
# NOTE: *.onrender.com names are globally unique. To keep these exact URLs on a
# new account, delete the old services from the old account first.
services:
  # --------------------------------------------------------------- backend --
  - type: web
    name: vayumitra-advisory
    runtime: python
    plan: free
    region: singapore                     # closest to Delhi/Hyderabad judges
    buildCommand: pip install -r requirements-advisory.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    # No healthCheckPath on purpose. Setting one to /health on the free plan made
    # Render's edge intermittently drop the instance from routing: ~20-37% of
    # requests came back 404 with `x-render-routing: no-server`, and those never
    # reached uvicorn at all (the app log shows only the successful ones, with
    # its own health probes passing every 5s throughout). Clearing it took the
    # failure rate to 0/50. The dashboard, which never had one, was always clean.
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      # -- LLM (Groq is OpenAI-compatible). Set the key in the dashboard. ----
      # Aug 2026: the llama-3.x line was decommissioned by Groq; these are the
      # current free-tier models. Do not use qwen3.6-27b — it leaks <think>.
      - key: GROQ_API_KEY
        sync: false                       # set in the dashboard, never in git
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FAST_MODEL
        value: openai/gpt-oss-20b
      # -- Voice (optional). ElevenLabs speaks EN+HI, Deepgram Aura is EN. ---
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVEN_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_TTS_MODEL
        value: aura-2-athena-en
      # -- Live data (Feature 4). Without OPENAQ_API_KEY the /live layer reports
      #    available:false and the UI falls back to the forecast layer, labelled
      #    as such - the app still runs, it just stops being live. FIRMS adds the
      #    regional-burning source; absent, the other three are unaffected. -----
      - key: OPENAQ_API_KEY
        sync: false                       # free at explore.openaq.org
      - key: FIRMS_MAP_KEY
        sync: false                       # free at firms.modaps.eosdis.nasa.gov
      # -- Keep-alive -------------------------------------------------------
      # Free services sleep after ~15 min idle (~30-60s cold start). Warming
      # them costs instance-hours around the clock: two always-on services burn
      # ~1,440 h/month against a ~750 h free allowance, which is what suspended
      # the first deployment four weeks in. Fine for a judging window, not for
      # a month. Leave blank -> the backend just self-pings; paste BOTH public
      # URLs (comma-separated) to warm the dashboard too; KEEPALIVE=0 to stop.
      - key: KEEPALIVE_URLS
        sync: false

  # -------------------------------------------------------------- frontend --
  - type: web
    name: airgrid-dashboard
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NITRO_PRESET
        value: node-server
      # Render substitutes the advisory service's hostname here at deploy time.
      # api.ts accepts a bare host and prefixes https:// itself.
      - key: VITE_API_URL
        fromService:
          type: web
          name: vayumitra-advisory
          property: host
